# ============================================================
# SecureIoT-X ML Configuration
# ============================================================

pipeline:
  random_seed: 42
  test_size: 0.20
  validation_size: 0.10
  n_jobs: -1  # Use all CPU cores

datasets:
  primary: "RT_IOT2022"
  supported:
    - name: "RT_IOT2022"
      path: "datasets/RT_IOT2022.csv"
      description: "RT-IoT2022 real traffic dataset"
    - name: "IoT23"
      path: "datasets/IoT23.csv"
      description: "IoT-23 Aposemat dataset"
    - name: "BoT_IoT"
      path: "datasets/BoT_IoT.csv"
      description: "BoT-IoT UNSW dataset"

preprocessing:
  max_missing_ratio: 0.50  # Drop columns with >50% missing
  scaling_method: "standard"  # standard | minmax
  encoding_method: "label"    # label | onehot
  handle_inf: true
  remove_duplicates: true
  outlier_method: "iqr"       # iqr | zscore | none

feature_selection:
  method: "importance"  # importance | correlation | both
  correlation_threshold: 0.95
  importance_threshold: 0.01
  max_features: 50

models:
  - name: "LogisticRegression"
    enabled: true
    params:
      max_iter: 1000
      class_weight: "balanced"
      random_state: 42

  - name: "DecisionTree"
    enabled: true
    params:
      max_depth: 20
      class_weight: "balanced"
      random_state: 42

  - name: "RandomForest"
    enabled: true
    params:
      n_estimators: 100
      max_depth: 20
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1

  - name: "SVM"
    enabled: true
    params:
      kernel: "rbf"
      class_weight: "balanced"
      random_state: 42
      max_iter: 5000

  - name: "GradientBoosting"
    enabled: true
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      random_state: 42

anomaly_detection:
  method: "isolation_forest"  # isolation_forest | ocsvm
  contamination: 0.05
  random_state: 42

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
  selection_criteria: "f1"
  selection_secondary: "recall"

model_storage:
  base_dir: "models"
  preprocessing_dir: "models/preprocessing"
  reports_dir: "reports"
