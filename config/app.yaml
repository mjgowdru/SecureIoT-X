# ============================================================
# SecureIoT-X Application Configuration
# ============================================================

app:
  name: "SecureIoT-X"
  version: "1.0.0"
  description: "AI-Driven Decentralized IDS for IoT Networks"
  debug: true

server:
  backend_host: "0.0.0.0"
  backend_port: 8000
  frontend_port: 3000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"

logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  file: "logs/secureiot.log"

modes:
  # simulation: Generate synthetic traffic (no hardware needed)
  # local: Full local development stack
  # esp32: Real ESP32 hardware mode
  active_mode: "simulation"

websocket:
  heartbeat_interval: 30
  max_connections: 100
