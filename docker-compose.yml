# ============================================================
# SecureIoT-X — Docker Compose
# ============================================================
# Services: backend, dashboard, mongodb, ganache, mqtt
#
# Usage:
#   docker compose up --build
#
# Ports exposed to host:
#   3000 — Dashboard (React + nginx)
#   8000 — Backend API (FastAPI)
#   27017 — MongoDB
#   7545 — Ganache (Ethereum RPC)
#   1883 — MQTT Broker
# ============================================================

services:

  # ── MongoDB (Primary Application Database) ─────────────────
  mongodb:
    image: mongo:7
    container_name: secureiot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - secureiot_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ganache (Real Ethereum Blockchain) ──────────────────────
  ganache:
    image: trufflesuite/ganache:latest
    container_name: secureiot-ganache
    restart: unless-stopped
    ports:
      - "7545:8545"
    volumes:
      - secureiot_ganache_data:/ganache_data
    command: >
      --chain.chainId 1337
      --database.dbPath /ganache_data
      --wallet.deterministic
      --wallet.totalAccounts 10
      --miner.blockGasLimit 10000000
      --server.host 0.0.0.0

  # ── MQTT Broker ─────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: secureiot-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureiot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
      ganache:
        condition: service_started
      mqtt:
        condition: service_started

  # ── React Dashboard (nginx) ─────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: secureiot-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  secureiot_mongo_data:
    driver: local
  secureiot_ganache_data:
    driver: local
